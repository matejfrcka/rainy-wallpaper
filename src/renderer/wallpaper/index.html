<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: rainmedia:; media-src 'self' blob: rainmedia:; connect-src 'self' blob: data: rainmedia:">
  <title>Rainy Glass Wallpaper</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: default; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    /* Glass widget: clock + now playing */
    .widget {
      position: fixed; display: none; box-sizing: border-box; width: clamp(270px, 18vw, 360px);
      padding: 16px 22px; border-radius: 18px; color: rgba(255,255,255,0.92);
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      text-shadow: 0 1px 12px rgba(0,0,0,0.35); transition: opacity .6s;
    }
    .widget.show { display: block; }
    .widget.top-left { top: 6vh; left: 3vw; } .widget.top-right { top: 6vh; right: 3vw; }
    .widget.bottom-left { bottom: 10vh; left: 3vw; } .widget.bottom-right { bottom: 10vh; right: 3vw; }
    .widget.center { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .w-time { white-space: nowrap; font-size: clamp(34px, 3.1vw, 64px); font-weight: 200; line-height: 1; letter-spacing: -0.02em; }
    .w-date { font-size: clamp(12px, 0.95vw, 18px); opacity: 0.8; margin-top: 6px; }
    .w-media { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: clamp(12px, 0.9vw, 17px); }
    .w-media:first-child { margin-top: 0; }
    .w-note { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,0.14); }
    .w-text { flex: 1; min-width: 0; text-align: left; }
    .w-scroll { overflow: hidden; white-space: nowrap; }
    .w-scroll.run { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 16px), transparent); }
    .w-track { display: inline-flex; }
    .w-scroll.run .w-track { animation: w-marquee linear infinite; animation-delay: 2s; }
    .w-scroll.run .w-copy { padding-right: 48px; }
    @keyframes w-marquee { from { transform: translateX(0); } to { transform: translateX(var(--dist)); } }
    .w-title { font-weight: 600; }
    .w-artist { opacity: 0.75; }
    .w-media.paused .w-note, .w-media.paused .w-title, .w-media.paused .w-artist { opacity: 0.55; }
    .w-controls { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
    .w-gap { flex: 1; }
    .w-btn.small { width: 30px; }
    .w-btn { width: 34px; height: 30px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.12); transition: background .15s, transform .1s; }
    .w-btn svg { width: 15px; height: 15px; fill: rgba(255,255,255,0.92); }
    .w-btn.main { width: 40px; }
    .w-btn.hover, .w-btn:hover { background: rgba(255,255,255,0.22); }
    .w-btn.press { transform: scale(0.9); background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <canvas id="glass"></canvas>
  <div class="widget" id="widget"></div>
  <script src="../../shared/defaults.js"></script>
  <script src="../../engine/shaders.js"></script>
  <script src="../../engine/rain-simulation.js"></script>
  <script src="../../engine/renderer.js"></script>
  <script src="../../engine/audio.js"></script>
  <script src="../../engine/engine.js"></script>
  <script src="../../engine/music.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
