<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: rainmedia:; media-src 'self' blob: rainmedia:; connect-src 'self' blob: data: rainmedia:">
  <title>Rainy Glass Wallpaper Engine</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="../../../assets/icon.png" alt="" class="brand-icon">
      <span class="brand-name">Rainy Glass</span>
      <span class="brand-sub">Wallpaper Engine</span>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
  </header>

  <div class="app">
    <nav class="sidebar" id="nav"></nav>

    <main class="panel" id="panel"></main>

    <aside class="preview-col">
      <div class="preview-card glass" id="previewCard">
        <canvas id="preview"></canvas>
        <div class="preview-badge" id="previewBadge" data-i18n>Live preview</div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="btnPause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span data-i18n>Pause rain</span></button>
        <button class="btn" id="btnResetRain" title="Clear the glass and start again"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n>Restart rain</span></button>
        <button class="btn" id="btnFullscreen" title="Full screen preview"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span data-i18n>Full screen</span></button>
        <button class="btn ghost" id="btnResetSettings" title="Restore default effect settings"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg><span data-i18n>Reset settings</span></button>
      </div>
      <div class="info-row" id="infoRow"></div>
    </aside>
  </div>

  <div class="drop-overlay" id="dropOverlay"><div><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></svg><span data-i18n>Drop an image to use it as background</span></div></div>
  <div class="toast" id="toast"></div>

  <script src="../../shared/defaults.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/gallery.js"></script>
  <script src="../../engine/shaders.js"></script>
  <script src="../../engine/rain-simulation.js"></script>
  <script src="../../engine/renderer.js"></script>
  <script src="../../engine/audio.js"></script>
  <script src="../../engine/engine.js"></script>
  <script src="settings.js"></script>
</body>
</html>
